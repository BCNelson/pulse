name: pulse
description: Flutter client for Pulse.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ferry: ^0.16.1
  ferry_flutter: ^0.9.1
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  gql_http_link: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.15.0
  ferry_generator: ^0.12.0

flutter:
  uses-material-design: true
