fragment TagSummary on Tag {
  id
  slug
  displayName
  path
  rootKind
  hasChildren
  archivedAt
}

query TagTree {
  myTagRoots {
    ...TagSummary
    children {
      ...TagSummary
      children {
        ...TagSummary
        children {
          ...TagSummary
        }
      }
    }
  }
}

query TagChildren($id: ID!) {
  tag(id: $id) {
    id
    children {
      ...TagSummary
      children {
        ...TagSummary
        children {
          ...TagSummary
        }
      }
    }
  }
}

# Resolve a tag from a URL slug path. The Flutter router carries the path
# as a slash-separated string; callers split it back into the list form
# this query expects. Returns null when no tag exists at that path.
query TagBySlugPath($path: [String!]!) {
  tagBySlugPath(path: $path) {
    ...TagSummary
  }
}
