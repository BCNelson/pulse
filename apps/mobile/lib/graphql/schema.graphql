"""
Pulse GraphQL schema.

M1: identity, tags, permissions.
M2: posts, comments, reactions, search.
M3+ : real-time, chat, tasks land in subsequent milestones.
"""

scalar Time
scalar JSON

# ----- shared -----

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# ----- enums -----

enum TagRootKind {
  ORG
  USER
}

enum PermissionBundle {
  VIEWER
  CONTRIBUTOR
  MODERATOR
  OWNER
}

enum SubscriptionUrgency {
  HIGH
  NORMAL
  LOW
  MUTE
}

enum PrincipalKind {
  USER
  BOT
}

enum PrincipalStatus {
  ACTIVE
  TOMBSTONED
}

enum DecisionStatus {
  DECISION
  ANSWER
}

enum SearchKind {
  POST
  COMMENT
}

enum PostSort {
  RECENT
  ACTIVE
}

# ----- principals -----

interface Principal {
  id: ID!
  globalUri: String!
  kind: PrincipalKind!
  status: PrincipalStatus!
  displayName: String!
  homeTag: Tag
}

type User implements Principal {
  id: ID!
  globalUri: String!
  kind: PrincipalKind!
  status: PrincipalStatus!
  displayName: String!
  homeTag: Tag
  email: String
}

type Bot implements Principal {
  id: ID!
  globalUri: String!
  kind: PrincipalKind!
  status: PrincipalStatus!
  displayName: String!
  homeTag: Tag
  ownerPrincipal: Principal
}

# ----- tags -----

type TagPermissions {
  bundle: PermissionBundle
  extras: [String!]!
  canView: Boolean!
  canContribute: Boolean!
  canModerate: Boolean!
  canOwn: Boolean!
}

type TagSubscription {
  cascade: Boolean!
  urgency: SubscriptionUrgency!
  reasonFilter: [String!]!
}

type Tag {
  id: ID!
  globalUri: String!
  slug: String!
  displayName: String!
  path: String!
  rootKind: TagRootKind!
  parent: Tag
  children: [Tag!]!
  defaults: JSON!
  archivedAt: Time
  createdAt: Time!
  myPermissions: TagPermissions!
  mySubscription: TagSubscription
  posts(first: Int, after: String, sort: PostSort): PostConnection!
}

# ----- posts -----

type PostTag {
  tag: Tag!
  viewRole: Boolean!
  interactRole: Boolean!
  moderateRole: Boolean!
}

type PostPermissions {
  bundle: PermissionBundle
  canView: Boolean!
  canContribute: Boolean!
  canModerate: Boolean!
}

type ReactionSummary {
  emoji: String!
  count: Int!
  byViewer: Boolean!
}

type Post {
  id: ID!
  globalUri: String!
  title: String!
  body: String!
  author: Principal!
  tags: [PostTag!]!
  mentions: [Principal!]!
  comments(first: Int, after: String): CommentConnection!
  reactions: [ReactionSummary!]!
  decisionStatus: DecisionStatus
  denyFlag: Boolean!
  myPermissions: PostPermissions!
  createdAt: Time!
  editedAt: Time
  deletedAt: Time
  lastReadAt: Time
}

type PostEdge {
  node: Post!
  cursor: String!
}

type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!
}

# ----- comments -----

type Comment {
  id: ID!
  postId: ID!
  parentId: ID
  depth: Int!
  author: Principal!
  body: String!
  mentions: [Principal!]!
  reactions: [ReactionSummary!]!
  createdAt: Time!
  editedAt: Time
  deletedAt: Time
}

type CommentEdge {
  node: Comment!
  cursor: String!
}

type CommentConnection {
  edges: [CommentEdge!]!
  pageInfo: PageInfo!
}

# ----- search -----

union SearchResult = Post | Comment

type SearchEdge {
  node: SearchResult!
  cursor: String!
  score: Float!
}

type SearchConnection {
  edges: [SearchEdge!]!
  pageInfo: PageInfo!
}

type TagSearchHit {
  tag: Tag!
  similarity: Float!
}

# ----- queries -----

type Query {
  health: String!
  serverTime: Time!

  viewer: User

  tag(id: ID!): Tag
  post(id: ID!): Post

  search(query: String!, kinds: [SearchKind!], first: Int): SearchConnection!
  searchTags(query: String!, first: Int): [TagSearchHit!]!
}

# ----- mutations -----

input CreateTagInput {
  parentId: ID!
  slug: String!
  displayName: String!
  defaults: JSON
}

input GrantTagInput {
  tagId: ID!
  principalId: ID!
  bundle: PermissionBundle!
  extras: [String!]
  cascade: Boolean
}

input SubscribeTagInput {
  tagId: ID!
  cascade: Boolean
  urgency: SubscriptionUrgency
  reasonFilter: [String!]
}

input PostTagInput {
  tagId: ID!
  viewRole: Boolean
  interactRole: Boolean
  moderateRole: Boolean
}

input CreatePostInput {
  title: String!
  body: String!
  tags: [PostTagInput!]!
}

input EditPostInput {
  postId: ID!
  title: String!
  body: String!
}

input CreateCommentInput {
  postId: ID!
  parentId: ID
  body: String!
}

type LoginPayload {
  token: String!
  expiresAt: Time!
  viewer: User!
}

type Mutation {
  login(email: String!, password: String!): LoginPayload!
  logout: Boolean!

  createTag(input: CreateTagInput!): Tag!
  moveTag(tagId: ID!, newParentId: ID!, reason: String): Tag!
  archiveTag(tagId: ID!): Tag!
  grantTag(input: GrantTagInput!): Tag!
  revokeTagGrant(tagId: ID!, principalId: ID!): Tag!
  subscribeTag(input: SubscribeTagInput!): TagSubscription!
  unsubscribeTag(tagId: ID!): Boolean!

  createPost(input: CreatePostInput!): Post!
  editPost(input: EditPostInput!): Post!
  deletePost(postId: ID!): Boolean!
  setDecisionStatus(postId: ID!, status: DecisionStatus): Post!
  setDenyFlag(postId: ID!, deny: Boolean!): Post!
  reactToPost(postId: ID!, emoji: String!): Post!
  unreactToPost(postId: ID!, emoji: String!): Post!
  markPostRead(postId: ID!): Post!

  createComment(input: CreateCommentInput!): Comment!
  editComment(commentId: ID!, body: String!): Comment!
  deleteComment(commentId: ID!): Boolean!
  reactToComment(commentId: ID!, emoji: String!): Comment!
  unreactToComment(commentId: ID!, emoji: String!): Comment!
}
