"""
Pulse GraphQL schema.

M1: identity, tags, permissions.
M2: posts, comments, reactions, search.
M3: chat (rooms, messages, DM detection, promotion to post) + real-time
    subscriptions (messageAdded, postChanged, tagStructureChanged).
M4: tasks, notifications inbox, notificationReceived subscription, worker
    mode for fan-out + retention.
"""

scalar Time
scalar JSON

# ----- shared -----

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# ----- enums -----

enum TagRootKind {
  ORG
  USER
}

enum PermissionBundle {
  VIEWER
  CONTRIBUTOR
  MODERATOR
  OWNER
}

enum SubscriptionUrgency {
  HIGH
  NORMAL
  LOW
  MUTE
}

enum PrincipalKind {
  USER
  BOT
}

enum PrincipalStatus {
  ACTIVE
  TOMBSTONED
}

enum DecisionStatus {
  DECISION
  ANSWER
}

enum SearchKind {
  POST
  COMMENT
  TASK
  MESSAGE
}

enum TaskStatus {
  OPEN
  IN_PROGRESS
  BLOCKED
  DONE
  CANCELLED
}

enum NotificationReason {
  ASSIGNMENT
  MENTION
  WATCHER
  TAG_SUBSCRIPTION
  DM
}

enum NotificationUrgency {
  HIGH
  NORMAL
  LOW
}

enum DevicePlatform {
  IOS
  ANDROID
  WEB
}

enum AttachmentOwnerKind {
  POST
  COMMENT
  MESSAGE
}

enum PostSort {
  RECENT
  ACTIVE
}

# ----- principals -----

interface Principal {
  id: ID!
  globalUri: String!
  kind: PrincipalKind!
  status: PrincipalStatus!
  displayName: String!
  homeTag: Tag
}

type User implements Principal {
  id: ID!
  globalUri: String!
  kind: PrincipalKind!
  status: PrincipalStatus!
  displayName: String!
  homeTag: Tag
  email: String
  """
  Latest posts authored by this user that the viewer can see. Used by
  the mention-preview panel to show a quick profile snapshot. Visibility
  is checked per post; soft-deleted posts are skipped. Default first=5,
  cap 25.
  """
  recentPosts(first: Int): [Post!]!
}

type Bot implements Principal {
  id: ID!
  globalUri: String!
  kind: PrincipalKind!
  status: PrincipalStatus!
  displayName: String!
  homeTag: Tag
  ownerPrincipal: Principal
}

# ----- tags -----

type TagPermissions {
  bundle: PermissionBundle
  extras: [String!]!
  canView: Boolean!
  canContribute: Boolean!
  canModerate: Boolean!
  canOwn: Boolean!
}

type TagSubscription {
  cascade: Boolean!
  urgency: SubscriptionUrgency!
  reasonFilter: [String!]!
}

type Tag {
  id: ID!
  globalUri: String!
  slug: String!
  displayName: String!
  path: String!
  rootKind: TagRootKind!
  parent: Tag
  children: [Tag!]!
  hasChildren: Boolean!
  defaults: JSON!
  archivedAt: Time
  createdAt: Time!
  myPermissions: TagPermissions!
  mySubscription: TagSubscription
  posts(first: Int, after: String, sort: PostSort): PostConnection!
  tasks(first: Int, after: String, status: TaskStatus): TaskConnection!
}

# ----- posts -----

type PostTag {
  tag: Tag!
  viewRole: Boolean!
  interactRole: Boolean!
  moderateRole: Boolean!
}

type PostPermissions {
  bundle: PermissionBundle
  canView: Boolean!
  canContribute: Boolean!
  canModerate: Boolean!
}

type ReactionSummary {
  emoji: String!
  count: Int!
  byViewer: Boolean!
}

type Post {
  id: ID!
  globalUri: String!
  title: String!
  body: String!
  author: Principal!
  tags: [PostTag!]!
  mentions: [Principal!]!
  """
  Tags referenced inline from this post's body via the canonical
  [#path](pulse-tag:path) link form. Link-only — distinct from `tags`,
  which carries ACL semantics.
  """
  referencedTags: [Tag!]!
  comments(first: Int, after: String): CommentConnection!
  reactions: [ReactionSummary!]!
  attachments: [Attachment!]!
  decisionStatus: DecisionStatus
  denyFlag: Boolean!
  myPermissions: PostPermissions!
  createdAt: Time!
  editedAt: Time
  deletedAt: Time
  lastReadAt: Time
}

type PostEdge {
  node: Post!
  cursor: String!
}

type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!
}

# ----- comments -----

type Comment {
  id: ID!
  postId: ID!
  parentId: ID
  depth: Int!
  author: Principal!
  body: String!
  mentions: [Principal!]!
  """
  Tags referenced inline from this comment's body via the canonical
  [#path](pulse-tag:path) link form. Link-only; no ACL impact.
  """
  referencedTags: [Tag!]!
  reactions: [ReactionSummary!]!
  attachments: [Attachment!]!
  createdAt: Time!
  editedAt: Time
  deletedAt: Time
}

type CommentEdge {
  node: Comment!
  cursor: String!
}

type CommentConnection {
  edges: [CommentEdge!]!
  pageInfo: PageInfo!
}

# ----- search -----

union SearchResult = Post | Comment

type SearchEdge {
  node: SearchResult!
  cursor: String!
  score: Float!
}

type SearchConnection {
  edges: [SearchEdge!]!
  pageInfo: PageInfo!
}

type TagSearchHit {
  tag: Tag!
  similarity: Float!
}

# ----- tasks (M4) -----

type TaskTag {
  tag: Tag!
  viewRole: Boolean!
  interactRole: Boolean!
  moderateRole: Boolean!
}

type TaskPermissions {
  bundle: PermissionBundle
  canView: Boolean!
  canContribute: Boolean!
  canModerate: Boolean!
}

type Task {
  id: ID!
  globalUri: String!
  title: String!
  description: String
  status: TaskStatus!
  dueAt: Time
  tags: [TaskTag!]!
  assignees: [Principal!]!
  watchers: [Principal!]!
  linkedPost: Post
  linkedComment: Comment
  createdBy: Principal!
  myPermissions: TaskPermissions!
  createdAt: Time!
  editedAt: Time
  deletedAt: Time
}

type TaskEdge {
  node: Task!
  cursor: String!
}

type TaskConnection {
  edges: [TaskEdge!]!
  pageInfo: PageInfo!
}

# ----- notifications (M4) -----

union NotificationSource = Post | Comment | Task | Message

type Notification {
  id: ID!
  recipient: Principal!
  reason: NotificationReason!
  urgency: NotificationUrgency!
  sourceType: String!
  sourceId: ID!
  source: NotificationSource
  sourceTag: Tag
  readAt: Time
  createdAt: Time!
}

type NotificationEdge {
  node: Notification!
  cursor: String!
}

type NotificationConnection {
  edges: [NotificationEdge!]!
  pageInfo: PageInfo!
  unreadCount: Int!
}

input NotificationFilter {
  unreadOnly: Boolean
  reasons: [NotificationReason!]
}

# ----- queries -----

type Query {
  health: String!
  serverTime: Time!

  viewer: User

  tag(id: ID!): Tag
  """
  Resolve a tag by walking its slug hierarchy. path is the ordered list
  of slugs from root to leaf (e.g. ["programming", "rust"]). Returns
  null if no tag exists at that path. Used by the mobile client to map
  /feed/t/<slug>/<slug>/... URLs back to a tag entity.
  """
  tagBySlugPath(path: [String!]!): Tag
  post(id: ID!): Post
  task(id: ID!): Task
  chatRoom(id: ID!): ChatRoom

  """
  Visible tag roots (tags with no parent, where the viewer holds any
  grant). The Flutter client uses this to seed the tag-tree pane;
  descendants come via Tag.children.
  """
  myTagRoots: [Tag!]!

  """
  Whether the viewer is currently impersonating someone else, and if
  so, who. Drives the loud "acting as" banner in the Flutter shell.
  """
  viewerImpersonationState: ImpersonationState!

  notifications(first: Int, after: String, filter: NotificationFilter): NotificationConnection!

  search(query: String!, kinds: [SearchKind!], first: Int): SearchConnection!
  searchTags(query: String!, first: Int): [TagSearchHit!]!
  """
  Prefix-match active users for the composer's @-mention typeahead. The
  primary signal is the user-tag root slug; display name is a secondary
  fuzzy fallback. Returns at most `first` (default 10, cap 25) hits.
  """
  searchUsers(query: String!, first: Int): [User!]!
  """
  Resolve a user by their handle — the slug of their user-tag root.
  Used by the mention-preview panel to fetch a profile from a `[@slug]`
  link target without a fuzzy search. Returns null when no active user
  owns that slug.
  """
  userByHandle(slug: String!): User
}

type ImpersonationState {
  isImpersonating: Boolean!
  acting: Principal
  effective: Principal
}

# ----- attachments (M6) -----

"""
An attachment is a file uploaded to the S3-compatible bucket and
associated with a post, comment, or message. The API never proxies
bytes — clients PUT to uploadUrl on `issueAttachmentUpload` and GET
from `downloadUrl` on the resolved Attachment.
"""
type Attachment {
  id: ID!
  ownerType: AttachmentOwnerKind!
  ownerId: ID!
  uploader: Principal!
  filename: String!
  mimeType: String!
  sizeBytes: Int!
  createdAt: Time!
  """
  Presigned URL for downloading the bytes. Short-lived (~15 minutes).
  Resolvers re-issue per request so a stale URL never lingers.
  """
  downloadUrl: String!
}

type AttachmentUploadTicket {
  attachmentId: ID!
  uploadUrl: String!
  method: String!
  expiresAt: Time!
  storageKey: String!
}

input IssueAttachmentUploadInput {
  ownerType: AttachmentOwnerKind!
  ownerId: ID!
  filename: String!
  mimeType: String!
  sizeBytes: Int!
}

# ----- mutations -----

input CreateTagInput {
  parentId: ID!
  slug: String!
  displayName: String!
  defaults: JSON
}

input GrantTagInput {
  tagId: ID!
  principalId: ID!
  bundle: PermissionBundle!
  extras: [String!]
  cascade: Boolean
}

input SubscribeTagInput {
  tagId: ID!
  cascade: Boolean
  urgency: SubscriptionUrgency
  reasonFilter: [String!]
}

input PostTagInput {
  tagId: ID!
  viewRole: Boolean
  interactRole: Boolean
  moderateRole: Boolean
}

input CreatePostInput {
  title: String!
  body: String!
  tags: [PostTagInput!]!
}

input EditPostInput {
  postId: ID!
  title: String!
  body: String!
}

input CreateCommentInput {
  postId: ID!
  parentId: ID
  body: String!
}

type LoginPayload {
  token: String!
  expiresAt: Time!
  viewer: User!
}

# ----- chat (M3) -----

type ChatRoomParticipant {
  principal: Principal!
  role: String!
  joinedAt: Time!
  leftAt: Time
}

type ChatRoom {
  id: ID!
  globalUri: String!
  isDM: Boolean!
  tags: [Tag!]!
  participants: [ChatRoomParticipant!]!
  messages(first: Int): MessageConnection!
  createdAt: Time!
  archivedAt: Time
}

type Message {
  id: ID!
  globalUri: String!
  chatRoom: ChatRoom!
  author: Principal!
  body: String!
  """
  Principals mentioned in the body via canonical [@slug](pulse-user:slug) links.
  Drives chat-mention notifications.
  """
  mentions: [Principal!]!
  """
  Tags referenced inline from this message's body via canonical
  [#path](pulse-tag:path) links. Link-only; no ACL impact.
  """
  referencedTags: [Tag!]!
  replyTo: Message
  attachments: [Attachment!]!
  createdAt: Time!
  editedAt: Time
  deletedAt: Time
  promotedToPost: Post
}

type MessageEdge {
  node: Message!
  cursor: String!
}

type MessageConnection {
  edges: [MessageEdge!]!
  pageInfo: PageInfo!
}

type TagStructureEvent {
  tagId: ID!
  kind: String!
}

input CreateChatRoomInput {
  tagIds: [ID!]
  participantIds: [ID!]
}

input SendMessageInput {
  roomId: ID!
  body: String!
  replyTo: ID
}

input TaskTagInput {
  tagId: ID!
  viewRole: Boolean
  interactRole: Boolean
  moderateRole: Boolean
}

input CreateTaskInput {
  title: String!
  description: String
  dueAt: Time
  tags: [TaskTagInput!]
  assignees: [ID!]
}

input EditTaskInput {
  taskId: ID!
  title: String
  description: String
  dueAt: Time
  clearDueAt: Boolean
}

# ----- mutations -----

type Mutation {
  login(email: String!, password: String!): LoginPayload!
  logout: Boolean!

  createTag(input: CreateTagInput!): Tag!
  moveTag(tagId: ID!, newParentId: ID!, reason: String): Tag!
  archiveTag(tagId: ID!): Tag!
  grantTag(input: GrantTagInput!): Tag!
  revokeTagGrant(tagId: ID!, principalId: ID!): Tag!
  subscribeTag(input: SubscribeTagInput!): TagSubscription!
  unsubscribeTag(tagId: ID!): Boolean!

  createPost(input: CreatePostInput!): Post!
  editPost(input: EditPostInput!): Post!
  deletePost(postId: ID!): Boolean!
  setDecisionStatus(postId: ID!, status: DecisionStatus): Post!
  setDenyFlag(postId: ID!, deny: Boolean!): Post!
  reactToPost(postId: ID!, emoji: String!): Post!
  unreactToPost(postId: ID!, emoji: String!): Post!
  markPostRead(postId: ID!, seenAt: Time): Post!

  createComment(input: CreateCommentInput!): Comment!
  editComment(commentId: ID!, body: String!): Comment!
  deleteComment(commentId: ID!): Boolean!
  reactToComment(commentId: ID!, emoji: String!): Comment!
  unreactToComment(commentId: ID!, emoji: String!): Comment!

  createTask(input: CreateTaskInput!): Task!
  editTask(input: EditTaskInput!): Task!
  deleteTask(taskId: ID!): Boolean!
  setTaskStatus(taskId: ID!, status: TaskStatus!): Task!
  assignTask(taskId: ID!, principalId: ID!): Task!
  unassignTask(taskId: ID!, principalId: ID!): Task!
  watchTask(taskId: ID!): Task!
  unwatchTask(taskId: ID!): Task!
  promotePostToTask(postId: ID!, title: String!, dueAt: Time, assignees: [ID!]): Task!
  promoteCommentToTask(commentId: ID!, title: String!, dueAt: Time, assignees: [ID!]): Task!

  markNotificationRead(notificationIds: [ID!]!): Int!
  markAllNotificationsRead: Int!

  """
  Impersonate another principal for the current session. Reason is
  recorded in audit. Only callers with a workspace admin grant on the
  org root may impersonate. The session token does not rotate — the
  same bearer continues to work, but acting/effective diverge until
  endImpersonation is called.
  """
  impersonate(principalId: ID!, reason: String!): ImpersonationState!
  endImpersonation: ImpersonationState!

  """
  Register the device's push token (FCM/APNs). Idempotent on (principal,
  token). The notification fan-out worker uses these to send push
  alerts for high-urgency notifications.
  """
  registerDeviceToken(token: String!, platform: DevicePlatform!): Boolean!
  unregisterDeviceToken(token: String!): Boolean!

  """
  Issue a presigned PUT URL for a new attachment. The client uploads
  bytes directly to the bucket, then calls confirmAttachmentUpload to
  flip the row to ready. Until that fires, the row is invisible to
  readers.
  """
  issueAttachmentUpload(input: IssueAttachmentUploadInput!): AttachmentUploadTicket!
  """
  Mark an attachment as ready after the client's PUT succeeded.
  sha256 is optional and verified out-of-band; the bucket's own
  integrity check is the source of truth.
  """
  confirmAttachmentUpload(attachmentId: ID!, sha256: String): Attachment!
  """
  Tombstone (soft-delete) an attachment. Bytes stay in the bucket
  until retention sweep; the attachment becomes invisible immediately.
  """
  removeAttachment(attachmentId: ID!): Boolean!

  createChatRoom(input: CreateChatRoomInput!): ChatRoom!
  addParticipant(roomId: ID!, principalId: ID!, role: String): ChatRoom!
  removeParticipant(roomId: ID!, principalId: ID!): ChatRoom!
  addRoomTag(roomId: ID!, tagId: ID!): ChatRoom!
  removeRoomTag(roomId: ID!, tagId: ID!): ChatRoom!
  sendMessage(input: SendMessageInput!): Message!
  editMessage(messageId: ID!, body: String!): Message!
  deleteMessage(messageId: ID!): Boolean!
  promoteMessage(messageId: ID!): Post!
}

# ----- subscriptions (M3) -----

type Subscription {
  """
  Fires whenever a new message lands in the named room. Auth is rechecked
  on every event — a viewer who loses access to the room mid-session
  stops receiving messages even before reconnecting.
  """
  messageAdded(roomId: ID!): Message!

  """
  Fires whenever a post visible to the viewer (under the named tag)
  changes. M3 emits on create only; M4 extends to update / delete.
  """
  postChanged(tagId: ID!): Post!

  """
  Fires when a tag is moved, renamed, or archived.
  """
  tagStructureChanged(tagId: ID!): TagStructureEvent!

  """
  Fires whenever a notification is written for the viewer. Auth is checked
  on connect — notifications are scoped to recipient_id = viewer.id.
  """
  notificationReceived: Notification!
}
