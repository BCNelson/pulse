schema:
  - schema.graphql

exec:
  filename: internal/graphql/generated.go
  package: graphql

model:
  filename: internal/graphql/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graphql
  package: graphql
  filename_template: "{name}.resolvers.go"

autobind:
  - github.com/bcnelson/pulse/services/api/internal/graphql/model

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  # Heavy fields that take args or want lazy resolution become field
  # resolvers — skip the model struct's eager-loaded copy.
  Tag:
    fields:
      posts:
        resolver: true
      tasks:
        resolver: true
  Post:
    fields:
      comments:
        resolver: true
  ChatRoom:
    fields:
      messages:
        resolver: true
