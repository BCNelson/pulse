name: Test

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Build
        working-directory: services/api
        run: go build ./...

      - name: Test
        working-directory: services/api
        run: go test -count=1 -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        working-directory: services/api
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/api/coverage.out
          flags: api

      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: services/api
          version: v2.12.2

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: codegen
        working-directory: apps/mobile
        run: flutter pub run build_runner build

      - name: analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: test
        working-directory: apps/mobile
        run: flutter test --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/mobile/coverage/lcov.info
          flags: mobile
