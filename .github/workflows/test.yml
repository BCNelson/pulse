name: Test

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Each test category produces its own coverprofile and uploads to
# codecov with a single <platform>-<type> flag (server-unit,
# mobile-integration, etc.). The repo-wide total comes from codecov's
# automatic per-commit union of all uploads; per-platform views are a
# UI multi-select over the matching `server-*` / `mobile-*` flags.

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Build
        working-directory: services/api
        run: go build ./...

      # Pure-logic packages: no Postgres, no RustFS, no GraphQL transport.
      - name: Test (unit)
        working-directory: services/api
        run: |
          go test -count=1 -race -covermode=atomic -coverprofile=coverage.unit.out \
            ./internal/mentions/... \
            ./internal/observability/... \
            ./internal/federation/... \
            ./pkg/ids/...

      - name: Upload server-unit coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/api/coverage.unit.out
          flags: server-unit

      # Testcontainer-backed integration tests: real Postgres + RustFS
      # via internal/pgtest. Includes the permission service, the
      # realtime LISTEN/NOTIFY pipeline, and the in-process worker
      # boot — everything that hits the DB but stops short of the full
      # HTTP -> resolver roundtrip.
      - name: Test (integration)
        working-directory: services/api
        run: |
          go test -count=1 -race -covermode=atomic -coverprofile=coverage.integration.out \
            ./cmd/api/... \
            ./internal/attachment/... \
            ./internal/audit/... \
            ./internal/auth/... \
            ./internal/bootstrap/... \
            ./internal/chat/... \
            ./internal/comment/... \
            ./internal/db/... \
            ./internal/graphql/loaders/... \
            ./internal/impersonation/... \
            ./internal/job/... \
            ./internal/notification/... \
            ./internal/perm/... \
            ./internal/post/... \
            ./internal/push/... \
            ./internal/realtime/... \
            ./internal/redaction/... \
            ./internal/retention/... \
            ./internal/search/... \
            ./internal/tag/... \
            ./internal/task/...

      - name: Upload server-integration coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/api/coverage.integration.out
          flags: server-integration

      # End-to-end GraphQL surface: HTTP transport -> resolver -> DB,
      # M1 through M4.5 milestones.
      - name: Test (e2e)
        working-directory: services/api
        run: |
          go test -count=1 -race -covermode=atomic -coverprofile=coverage.e2e.out \
            ./internal/graphql/

      - name: Upload server-e2e coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/api/coverage.e2e.out
          flags: server-e2e

      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: services/api
          version: v2.12.2

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: codegen
        working-directory: apps/mobile
        run: flutter pub run build_runner build

      - name: analyze
        working-directory: apps/mobile
        run: flutter analyze

      # Pure-Dart units: caches, codecs, drift outbox, auth_storage,
      # ferry RetryLink/AuthLink. No widget pumping.
      - name: test (unit)
        working-directory: apps/mobile
        run: flutter test --coverage --coverage-path=coverage/unit.info test/core/

      - name: Upload mobile-unit coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/mobile/coverage/unit.info
          flags: mobile-unit

      # WidgetTester-driven screen + composer tests. Widget tests
      # integrate multiple components in memory (provider tree,
      # router, theme) without a real backend, so they live under the
      # `integration` type rather than `unit`. End-to-end mobile<->API
      # tests would live in apps/mobile/integration_test/ when added,
      # uploaded with `mobile-e2e` (no such tests exist today).
      - name: test (integration)
        working-directory: apps/mobile
        run: flutter test --coverage --coverage-path=coverage/integration.info test/features/ test/widget_test.dart

      - name: Upload mobile-integration coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/mobile/coverage/integration.info
          flags: mobile-integration
